<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.moral | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ramabhadra&family=Mandali&family=Suravaram&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='26' fill='%23f6c33b'/><circle cx='44' cy='24' r='22' fill='%23fbf3dc'/></svg>">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg class="moon" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="26" fill="#f6c33b"/>
        <circle cx="44" cy="24" r="22" fill="var(--mast)"/>
      </svg>
      <span class="brand-name">{{ site.title }}</span>
    </a>
    <p class="tagline">{{ site.tagline }}</p>
  </header>

  <main class="page">
    {{ content }}
  </main>

  <footer class="footer">
    <span class="ornament">❁ ❁ ❁</span>
    <p>{{ site.title }} · {{ 'now' | date: '%Y' }}</p>
  </footer>
</body>
</html>
